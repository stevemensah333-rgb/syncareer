<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline · Syncareer</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="theme-color" content="#00c4cc" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        background: #f6f5f1;
        color: #111;
        min-height: 100vh;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid #e5e5e5;
        font-size: 12px;
        color: #666;
        margin-bottom: 24px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f59e0b;
      }
      h1 {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 40px;
        line-height: 1.1;
        font-weight: 400;
        margin: 0 0 16px;
        color: #111;
      }
      p {
        font-size: 15px;
        color: #555;
        line-height: 1.5;
        margin: 0 0 28px;
      }
      button {
        appearance: none;
        border: 0;
        background: #111;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        padding: 11px 22px;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      button:hover {
        background: #333;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="badge"><span class="dot"></span>You're offline</div>
        <h1>No connection right now</h1>
        <p>
          Some parts of Syncareer work offline — your CV drafts, the assessment,
          and interview practice. Reconnect to sync your progress.
        </p>
        <button onclick="window.location.reload()">Try again</button>
      </div>
    </div>
  </body>
</html>
