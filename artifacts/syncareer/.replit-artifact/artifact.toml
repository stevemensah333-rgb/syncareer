kind = "web"
previewPath = "/"
title = "Syncareer"
version = "1.0.0"
id = "artifacts/syncareer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19713

[services.development]
run = "corepack pnpm --config.verify-deps-before-run=false --dir artifacts/syncareer exec vite --config vite.config.ts --host 0.0.0.0"

[services.production]
build = [ "corepack", "pnpm", "--config.verify-deps-before-run=false", "--dir", "artifacts/syncareer", "exec", "vite", "build", "--config", "vite.config.ts" ]
publicDir = "artifacts/syncareer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19713"
BASE_PATH = "/"
