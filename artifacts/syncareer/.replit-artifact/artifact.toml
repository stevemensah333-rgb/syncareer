kind = "web"
previewPath = "/"
title = "Syncareer"
version = "1.0.0"
id = "artifacts/syncareer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19713

[services.development]
run = "pnpm --filter @workspace/syncareer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/syncareer", "run", "build" ]
publicDir = "artifacts/syncareer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19713"
BASE_PATH = "/"
